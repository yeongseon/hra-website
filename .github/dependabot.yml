# 보안 공지 이후에도 직접·전이 의존성 갱신 제안을 매주 검토합니다.
# 자동 병합하지 않으며 기존 앱 CI와 리뷰 절차를 유지합니다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-framework:
        patterns:
          - next
          - eslint-config-next
      auth-framework:
        patterns:
          - next-auth
          - "@auth/core"
      # 에디터 패키지 간 버전을 함께 맞춰 호환성 오류를 방지합니다.
      tiptap:
        patterns:
          - "@tiptap/*"
      # React와 렌더러 및 타입 정의를 함께 갱신해 peer 의존성을 맞춥니다.
      react-renderer:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
