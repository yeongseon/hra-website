name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 검증 작업에는 저장소 읽기만 허용하고 checkout 인증은 후속 명령에 남기지 않습니다.
permissions:
  contents: read

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    env:
      # PR 코드와 브라우저 검사는 운영 서비스의 DB·Blob 자격 증명을 받지 않습니다.
      # DB 접속이 필요한 SQL 회귀 테스트는 아래 임시 PostgreSQL 클러스터를 직접 띄웁니다.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/isolated
      AUTH_SECRET: ci-only-secret-for-isolated-smoke-tests
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

    steps:
      # 기존 v4 태그의 검증한 commit을 고정합니다. 갱신 절차: docs/developer/github-actions-security.md
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: DB 소스 목록 계약 검사
        # Git 경로와 파일 바이트만 읽으며 SQL·DB·Blob·환경 파일을 실행하지 않습니다.
        run: |
          node --test scripts/tests/db-source-inventory.test.mjs
          node scripts/check-db-source-inventory.mjs

      - name: 신규 설치 소스 대응 계약
        # 기존 inventory를 정본으로 참조하고 미해결 설치 조건을 준비 완료로 오인하지 않습니다.
        run: |
          node --test scripts/tests/db-installation-contract.test.mjs
          node --test scripts/tests/db-fresh-candidate-*.test.mjs
          node scripts/check-db-installation-contract.mjs

      - name: 기본 DB push·스키마 설치 접속 차단 회귀
        # 차단된 합성 대상에서 기본 접속·계획 전용 설치 명령의 우회 거부와 오프라인 SQL 생성을 검사합니다.
        run: |
          node --test scripts/tests/db-push-guard.test.mjs
          node --test scripts/tests/schema-plan-cli.test.mjs

      - name: 버전 SQL manifest·이력 snapshot 소스 계약
        # 실제 적용 이력을 만들지 않고 파일·Git·전달된 JSON의 일관성만 확인합니다.
        run: |
          node --test scripts/tests/db-migration-manifest.test.mjs
          node scripts/check-db-migration-manifest.mjs

      - name: 환경변수 문서·예시 계약 검사
        # 실제 .env·DB·Blob에 접근하지 않고 설치한 TypeScript로 소스만 읽습니다.
        run: |
          node --test scripts/tests/environment-contract.test.mjs
          node scripts/check-environment-contract.mjs

      - name: 로컬 push 훅 ref 계약 검사
        # 삭제 전용 push만 빌드를 생략하고 코드 ref·손상된 입력은 계속 차단합니다.
        run: node --test scripts/tests/pre-push-hook.test.mjs

      - name: ESLint 검사
        run: npm run lint

      - name: TypeScript 타입 검사
        run: npm run typecheck

      - name: 격리 PostgreSQL 준비
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          printf 'HRA_TEST_PG_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"

      - name: 로컬 migration 원자성·경합·연결 유실 복구
        # 실제 임시 PG만 소유하는 factory로 검증하며 운영 URL·승인 입력을 받지 않습니다.
        timeout-minutes: 10
        run: node --test --test-concurrency=1 scripts/tests/db-migration-*.test.mjs tests/integration/db-migration-local.test.mjs

      - name: 신규 설치 원문 기준·후보 전체 복구 계약
        # 독립 원문 기준 DB와 후보 엔진 DB를 소유 로컬 PG에 따로 만들고 단계별 catalog·실패 복구를 대조합니다.
        timeout-minutes: 10
        run: node --test --test-concurrency=1 tests/integration/db-fresh-reference.test.mjs tests/integration/db-fresh-bundle.test.mjs

      - name: 관리 CLI 계정 연결·비공개 파일 보호 회귀
        # 소유 임시 PG와 합성 Blob 저장소만 사용하고 외부 서비스 호출을 차단합니다.
        timeout-minutes: 5
        run: node --test scripts/tests/management-cli-safety.test.mjs

      - name: 한정 스키마 설치 CLI의 무인자·원자 적용 회귀
        # 소유 임시 PG에서만 두 컬럼의 소유권·정의·기존 값 보존을 검증합니다.
        timeout-minutes: 5
        run: node --test scripts/tests/schema-installer-cli.test.mjs

      - name: 단위 테스트
        run: npm test

      - name: Next.js 빌드
        run: npm run build

      - name: Proxy 인증 경계 HTTP 회귀
        # 실제 Auth.js 래퍼와 격리 DB 세션으로 역할별 302/403 응답을 확인합니다.
        run: npm run verify:auth-proxy

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 에디터 미리보기 키보드 회귀
        # 운영 계정 없이 실제 에디터·CSS·Dialog를 Chromium에서 검증합니다.
        run: npm run verify:editor-preview

      - name: 학사 G1 실제 제출 품질 게이트
        # fork PR에서도 secrets 없이 실제 앱·격리 DB·로컬 private 저장소를 검증합니다.
        timeout-minutes: 10
        run: npm run test:academic-g1

      - name: 회원 경로·스모크 테스트 수집 (외부 OAuth·Blob 연결 제외)
        # 실제 수집된 경로·테스트 이름과 개수를 실행 전에 CI 로그로 남깁니다.
        run: npm run test:e2e -- tests/e2e/ci-smoke.spec.ts --list

      - name: 회원 경로·브라우저 스모크 테스트
        # 공통 보호 경로 목록 전체를 검사하고, 운영 DB가 필요한 공개 자료 검증은 분리합니다.
        # 위의 실제 G1·Proxy HTTP 게이트는 그대로 유지합니다.
        run: npm run test:e2e -- tests/e2e/ci-smoke.spec.ts
