# 공개 저장소의 secret·검토 원장·실제 브라우저 CSP를 운영 비밀 없이 검사합니다.
name: 저장소 보안 · 브라우저 CSP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 일요일 한국 시간 03:41. 실제 예약 실행은 GitHub 대기열에 따라 늦을 수 있습니다.
    - cron: "41 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repository:
    name: 추적 소스 · 도달 가능한 이력 · dependency 검토
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 정책 실패 경로·산출물 차단 계약
        run: node --test scripts/tests/secret-scan.test.mjs scripts/tests/dependency-policy.test.mjs scripts/tests/public-artifact-policy.test.mjs scripts/tests/public-source-policy.test.mjs scripts/tests/repository-security-workflow.test.mjs
      - name: 공개 문서·fixture의 개인정보 표식 검사
        run: npm run verify:public-sources
      - name: 고정 scanner 검증·실제 source/history canary·전체 검사
        run: |
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/hra-gitleaks.XXXXXX")"
          cleanup() {
            node -e 'const fs=require("node:fs"),p=require("node:path");const target=p.resolve(process.argv[1]);if(p.dirname(target)!==p.resolve(process.env.RUNNER_TEMP)||!p.basename(target).startsWith("hra-gitleaks."))process.exit(1);fs.rmSync(target,{recursive:true,force:true});' "$scanner_dir"
          }
          trap cleanup EXIT
          curl -fsSL --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          npm run verify:repository-secrets -- --gitleaks "$scanner_dir/gitleaks"
      - name: 실제 registry와 정확한 검토 기한 대조
        run: npm run verify:dependencies

  browser:
    name: 실제 production CSP · 에디터 · 인쇄 · Blob SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 격리 PostgreSQL 준비
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          printf 'HRA_TEST_PG_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 실제 음성 canary·설치 SDK 단일 및 multipart 계약
        run: node --test scripts/tests/csp-browser.test.mjs
      - name: 격리 production 서버의 실제 브라우저 검증
        run: npm run verify:csp
