# 인증 변경은 합성 계정·격리 DB에서 검증합니다. 동일 lock일 때만 기준 commit과 비용을 비교합니다.
name: 인증 비용·권한 회수 회귀

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 비교할 조상 commit의 전체 SHA 40자
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/authentication-measurement.yml
      - scripts/measure-authentication.mjs
      - scripts/tests/auth-measurement*.test.mjs
      - tests/support/auth-measurement-*.mjs
      - packages/contracts/package.json
      - packages/contracts/src/identity.ts
      - src/lib/auth*.ts
      - src/lib/request-session.ts
      - src/lib/admin.ts
      - src/lib/member.ts
      - src/lib/academic-admin.ts
      - src/proxy.ts

permissions:
  contents: read

concurrency:
  group: authentication-measurement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: 조건부 비용 비교 · 200개 계정 · 즉시 권한 회수
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 기준 commit을 조상으로 확인하고 소유한 detached worktree에서 빌드합니다.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 격리 PostgreSQL 준비
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          printf 'HRA_TEST_PG_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
      - name: 계측 계약·공급자 바인딩 회귀
        run: |
          node --test scripts/tests/auth-measurement*.test.mjs
          npx vitest run tests/unit/oauth-provider-boundary.test.ts tests/unit/auth-signin-io.test.ts tests/unit/auth-jwt-session.test.ts
      - name: 동일 lock이면 전후 비교, 변경됐으면 현재 인증 경계 검증
        env:
          # 표현식은 셸 코드로 보간하지 않고 인수로만 전달하며 실행기가 SHA를 검증합니다.
          BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.baseline_ref }}
        run: |
          # 기준 SHA와 조상 관계는 단일 실행 분기에서도 먼저 검증해 잘못된 입력이 비교를 우회하지 못하게 합니다.
          [[ "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$BASELINE_REF" HEAD
          if git diff --quiet "$BASELINE_REF" HEAD -- package-lock.json; then
            npm run verify:auth-measurement -- --compare --baseline-ref "$BASELINE_REF" --output test-results/authentication-measurement.json
          else
            status=$?
            test "$status" -eq 1
            # 서로 다른 의존성의 비용 수치를 비교하지 않고 현재 빌드의 권한 회수·실패 차단만 실행합니다.
            echo AUTH_MEASURE_CURRENT_ONLY_LOCK_CHANGED
            npm run verify:auth-measurement -- --single --output test-results/authentication-measurement.json
          fi
      - name: 공개 산출물의 허용 필드·민감 정보 위험 검사
        id: artifact_safety
        if: always()
        # 실패 보고서도 검사하며 누락·검사 실패 때 업로드하지 않습니다.
        run: node scripts/check-public-artifact.mjs --kind authentication-measurement --file test-results/authentication-measurement.json
      - name: 식별자 없는 비용·회귀 결과 보관
        if: always() && steps.artifact_safety.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authentication-measurement
          path: test-results/authentication-measurement.json
          if-no-files-found: warn
          retention-days: 7
