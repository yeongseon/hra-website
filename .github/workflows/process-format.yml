# 본문 정책은 process-format.mjs, PR 제목/릴리스 정책은 release-policy.mjs에서 검증한다.
name: 이슈·PR 형식
on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue:
    name: 이슈 형식
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: process-format-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-process-format.mjs --event
        env:
          GH_TOKEN: ${{ github.token }}

  pull-request:
    name: PR 형식
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: process-format-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      # PR 작성자가 검사 코드를 수정해서 자기 PR을 면제하지 못하게 base SHA를 사용한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # 최초 PR의 신뢰된 base에는 .nvmrc가 없을 수 있어 파일 대신 메이저 버전을 명시한다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-process-format.mjs --event
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_BOT_LOGIN: ${{ vars.RELEASE_PLEASE_BOT_LOGIN }}

  contracts:
    name: 형식·릴리스 계약 테스트
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # 변경된 규칙 자체도 검증한다. 읽기 전용, 토큰/DB 비밀값/의존성 설치 없이 실행한다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/tests/release-policy.test.mjs
      - run: node scripts/check-release-config.mjs
      - run: node --test scripts/tests/commit-messages.test.mjs
      - name: 새 커밋 메시지 검사
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-commit-messages.mjs --history

  audit:
    name: 열린 이슈·PR 일괄 검사
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-process-format.mjs --all
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_BOT_LOGIN: ${{ vars.RELEASE_PLEASE_BOT_LOGIN }}
