# 기본 PR CI와 별도로 공개 브라우저·학사 사용자 여정을 합성 환경에서 검사합니다.
name: 확장 E2E 회귀

on:
  schedule:
    # 매일 한국 시간 03:23. 정각 예약 집중을 피하고 실제 소요는 실행 로그로 확인합니다.
    - cron: "23 18 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    # 새 게이트 자체가 바뀌는 PR에서도 검증하되 일반 PR의 필수 CI는 그대로 둡니다.
    paths:
      - .github/workflows/expanded-e2e.yml
      - scripts/verify-site-routes.mjs
      - scripts/tests/expanded-*.test.mjs
      - tests/support/expanded-public-*
      - tests/e2e/home.spec.ts
      - tests/e2e/home-calendar-responsive.spec.ts
      - tests/e2e/keyboard-navigation.spec.ts
      - tests/e2e/notice-search-history.spec.ts

permissions:
  contents: read

concurrency:
  group: expanded-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  expanded:
    name: 공개 12건 · 학사 G1 10개 필수 사례
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 런너도 별도 환경 허용 목록으로 다시 제한하며 운영 비밀정보는 전달하지 않습니다.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/isolated
      AUTH_SECRET: ci-only-secret-for-isolated-smoke-tests
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 격리 PostgreSQL 준비
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_bin="$(pg_config --bindir)"
          test -x "$pg_bin/initdb"
          test -x "$pg_bin/pg_ctl"
          printf 'HRA_TEST_PG_BIN=%s\n' "$pg_bin" >> "$GITHUB_ENV"
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 확장 실행기·보고서·실제 외부 통신 차단 계약 검사
        run: node --test scripts/tests/expanded-*.test.mjs
      - name: 공개 E2E 수집·실행 및 학사 G1 필수 사례
        # 공개 전체 스키마 fixture와 G1 축소 스키마는 서로 다른 폐기 가능한 DB입니다.
        run: npm run test:e2e:expanded
      - name: 개인정보 없는 공개 사례 결과 보관
        if: always()
        # 공식 v4 태그를 2026-10-22 Git refs·commit API로 확인했습니다.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expanded-public-results
          path: test-results/expanded-public.json
          if-no-files-found: warn
          retention-days: 7
