# 버전·변경 이력·GitHub Release만 관리한다. 앱 배포 및 npm publish는 하지 않는다.
name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    # 별도 토큰과 Actions PR 생성 권한을 확인한 뒤 저장소 변수를 켠다.
    if: github.repository == 'yeongseon/hra-website' && github.ref == 'refs/heads/main' && vars.RELEASE_PLEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: 릴리스 토큰 확인
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo '::error::RELEASE_PLEASE_TOKEN이 설정되지 않았습니다.'
            exit 1
          fi
      # v4.4.1 (2026-10-13 확인). 버전 태그가 아니라 검증한 commit을 고정한다.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
